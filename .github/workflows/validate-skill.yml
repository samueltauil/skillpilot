name: Validate Skill Submission

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/registry.json'
      - 'skills/submissions/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ajv-cli for JSON validation
        run: npm install -g ajv-cli ajv-formats

      - name: Fetch base branch for diff
        continue-on-error: true
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Validate new skills against schema
        run: |
          SKILL_COUNT=$(node -e "
            const fs = require('fs');
            const registry = require('./skills/registry.json');
            const { execSync } = require('child_process');

            let baseSkillIds = new Set();
            try {
              const baseJson = execSync('git show FETCH_HEAD:skills/registry.json', { encoding: 'utf8' });
              JSON.parse(baseJson).skills.forEach(s => baseSkillIds.add(s.id));
            } catch (e) {
              console.error('Could not load base registry; validating all skills');
            }

            const skillsToValidate = baseSkillIds.size > 0
              ? registry.skills.filter(s => !baseSkillIds.has(s.id))
              : registry.skills;

            fs.writeFileSync(
              '/tmp/registry-to-validate.json',
              JSON.stringify({ version: registry.version, skills: skillsToValidate }, null, 2)
            );
            process.stdout.write(String(skillsToValidate.length));
          ")
          if [ "$SKILL_COUNT" -eq 0 ]; then
            echo "✅ No new skills to validate"
          else
            SCHEMA_SPEC=$(node -e "
              const schema = require('./skills/schema.json');
              const schemaUri = schema['\$schema'] || '';
              process.stdout.write(schemaUri.includes('draft/2020-12') ? 'draft2020' : 'draft7');
            ")
            echo "Validating $SKILL_COUNT new skill(s) against schema..."
            ajv validate -s skills/schema.json -d /tmp/registry-to-validate.json --spec="$SCHEMA_SPEC" --strict=false -c ajv-formats
            echo "✅ New skill entries are schema-valid"
          fi

      - name: Check for duplicate skill IDs
        run: |
          node -e "
            const registry = require('./skills/registry.json');
            const ids = registry.skills.map(s => s.id);
            const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (duplicates.length > 0) {
              console.error('❌ Duplicate skill IDs found:', duplicates);
              process.exit(1);
            }
            console.log('✅ No duplicate skill IDs');
          "

      - name: Validate skill source URLs
        run: |
          node -e "
            const registry = require('./skills/registry.json');
            const { execSync } = require('child_process');

            // Load base-branch registry to identify pre-existing skills
            let baseSkillIds = new Set();
            try {
              const baseJson = execSync('git show FETCH_HEAD:skills/registry.json', { encoding: 'utf8' });
              JSON.parse(baseJson).skills.forEach(s => baseSkillIds.add(s.id));
            } catch (e) {
              console.log('Could not load base registry; validating all skills');
            }

            // Only validate skills that are new in this PR
            const newSkills = baseSkillIds.size > 0
              ? registry.skills.filter(s => !baseSkillIds.has(s.id))
              : registry.skills;

            if (newSkills.length === 0) {
              console.log('✅ No new skills to validate');
              process.exit(0);
            }
            console.log('Validating ' + newSkills.length + ' new skill(s): ' + newSkills.map(s => s.id).join(', '));

            const errors = [];
            for (const skill of newSkills) {
              if (!skill.source?.repo?.startsWith('https://github.com/')) {
                errors.push(skill.id + ': Invalid repo URL (must start with https://github.com/)');
              }
              const path = skill.source?.path;
              const skillFile = skill.source?.skillFile;
              const hasValidPath = path?.endsWith('.md') || (skillFile?.endsWith('.md') && path && !path.endsWith('.md'));
              if (!hasValidPath) {
                errors.push(skill.id + ': Invalid path (must end with .md, or provide a skillFile ending with .md)');
              }
            }
            if (errors.length > 0) {
              console.error('❌ Validation errors:');
              errors.forEach(e => console.error('  - ' + e));
              process.exit(1);
            }
            console.log('✅ All new skill source URLs are valid');
          "

      - name: Post validation summary
        if: always()
        run: |
          echo "## Skill Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ All validations passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Validation failed. Please check the errors above." >> $GITHUB_STEP_SUMMARY
          fi
